# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# Feel free to add/modify any of these entries.

# Site Settings
title: "Junteng Liu"
title_separator: "-"
subtitle: " "
name: &name "Junteng Liu"
description: "Personal homepage of Junteng Liu, Ph.D. candidate at HKUST NLP Group."
url: "https://Thresholdplosecret.github.io"
baseurl: "/LJT-Homepage"
repository: "Thresholdplosecret/LJT-Homepage"
teaser: # filename of a teaser image with width "800" and height "400" placed in /images/
logo: # filename of a logo image placed in /images/
words_per_minute: 200
comments:
  provider: "disqus"
  disqus:
    shortname:
atom_feed:
  path: # leave blank to use the default path
search: true
#render_math: true

# SEO Related
google_site_verification :
bing_site_verification :
alexa_site_verification :
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:

# Social Sharing
twitter:
  username: &twitter "junteng88716710"
facebook:
  username:
  logo: # filename of a logo image placed in /images/
og_image: # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/social/docs/markup/reference/profile-attributes
social_profile:
  facebook:
  instagram:
  twitter:
  linkedin:
  github:
  youtube:
  chineseodds:

# Site Author
author:
  name: "Junteng Liu"
  avatar: "https://avatars.githubusercontent.com/u/306975233?v=4"
  bio: "Ph.D. candidate at HKUST NLP Group. Research focuses on natural language processing and machine learning."
  location: "Hong Kong"
  employer:
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&amp;view_op=list_works&amp;sortby=pubdate"
  orcid:
  twitter: "junteng88716710"
  linkedin:
  researchgate:
  website:

# Reading Files
include:
  - .htaccess
  - _pages
  - _images
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekmez-asset-cache
  - .sass-cache
  - _plugins
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/datetime.js
  - assets/js/placeholder.js
  - assets/js/stylesheet.js
  - Gemfile
  - Gemfile.lock
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - TODO
  - package.json
  - package-lock.json
  - python
  - requirements.txt
  - сov
  - _talks
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections defaults
defaults:
  scope:
    path: ""
    type: "pages"
  values:
    layout: "single"
  scope:
    path: ""
    type: "publications"
  values:
    layout: "single"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# DefaultYAML Front Matter
defaults:
  scope:
    path: ""
    type: "publications"
  values:
    layout: "single"

# Plugins
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

# Jekyll Defaults
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: "/page:num/"

# Outputting
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Front Matter Defaults
defaults:
  scope:
    path: ""
    type: "posts"
  values:
    layout: "single"
    author_profile: true
    read_time: true
    comments: true
    share: true
    related: true
  scope:
    path: ""
    type: "pages"
  values:
    layout: "single"
    comments: false
    share: false
    related: false
  scope:
    path: ""
    type: "publications"
  values:
    layout: "single"
    comments: false
    share: false
    related: false
    author_profile: false

# Site Tag
tag_archive:
  metadata:
    path: /tags/

# Analytics
analytics:
  provider: "google-universal"
  google:
    tracking_id:
    anonymize_ip: false

# Authorization
github: [metadata]
